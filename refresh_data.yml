name: Nightly Data Refresh & Keep-Alive

on:
  schedule:
    # Runs every 4 hours year-round to prevent Streamlit Cloud sleep
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping RCDef app to prevent sleep
        run: |
          # Replace with your actual Streamlit Cloud URL after deploying
          APP_URL="https://rcdef.streamlit.app"
          echo "Pinging $APP_URL..."
          curl -s -o /dev/null -w "HTTP %{http_code}" --max-time 30 "$APP_URL" || echo "Ping failed (app may be rebuilding)"
          echo "Keep-alive ping complete: $(date -u)"

  refresh:
    runs-on: ubuntu-latest
    needs: keepalive
    # Only run full data refresh during baseball season (March-October)
    if: |
      contains(fromJSON('["3","4","5","6","7","8","9","10"]'),
               format('{0}', github.event.schedule != '' && '1' || fromJSON('{"3":"3","4":"4","5":"5","6":"6","7":"7","8":"8","9":"9","10":"10"}')[format('{0}', dateFormat(github.run_started_at, 'M'))] || '0'))
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate app
        run: |
          python3 -c "
          import ast
          with open('streamlit_app.py' if __import__('os').path.exists('streamlit_app.py') else 'rcdef_app.py') as f:
              src = f.read()
          ast.parse(src)
          print('Syntax OK, lines:', len(src.splitlines()))
          "

      - name: Update refresh timestamp
        run: |
          echo "Last refreshed: $(date -u)" > last_refresh.txt

      - name: Commit timestamp
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add last_refresh.txt
          git diff --staged --quiet || git commit -m "Keep-alive + data refresh $(date -u +%Y-%m-%d-%H%M)"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
